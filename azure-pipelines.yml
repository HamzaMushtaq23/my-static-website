# HTML Static Website CI/CD Pipeline

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variable group 11-Sep'

stages:

# ============================================================
# STAGE 1: BUILD
# ============================================================
- stage: Build
  displayName: 'Build and Publish Artifact'

  jobs:
  - job: BuildWebsite
    displayName: 'Build Website'

    steps:

    # Create ZIP artifact
    - task: ArchiveFiles@2
      displayName: 'Create website ZIP'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/1.zip'
        replaceExistingArchive: true

    # Publish ZIP artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish website artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/1.zip'
        ArtifactName: 'website'
        publishLocation: 'Container'


# ============================================================
# STAGE 2: DEPLOY
# ============================================================
- stage: Deploy
  displayName: 'Deploy to Azure Static Web App'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployWebsite
    displayName: 'Deploy Website'

    steps:

    # Deploy to Azure Static Web App
    - task: AzureStaticWebApp@0
      displayName: 'Deploy to Azure Static Web App'
      inputs:
        app_location: '/'
        output_location: ''
        skip_app_build: true
        skip_api_build: true
        azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'