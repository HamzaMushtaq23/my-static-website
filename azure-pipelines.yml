# HTML
# Archive your static HTML project and save it with the build record.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variable group 11-Sep'

steps:

# Create ZIP artifact
- task: ArchiveFiles@2
  displayName: 'Create website ZIP'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/1.zip'
    replaceExistingArchive: true

# Publish ZIP artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish website artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/1.zip'
    ArtifactName: 'website'
    publishLocation: 'Container'

# Deploy to Azure Static Web App
- task: AzureStaticWebApp@0
  displayName: 'Deploy to Azure Static Web App'
  inputs:
    app_location: '/'
    output_location: ''
    skip_app_build: true
    skip_api_build: true
    azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'